# Synty Explorer — no Dockerfile needed (stdlib only).
#
#   1. Put your .unitypackage files (or Synty source-pack folders) in ./packages
#   2. docker compose run --rm index      # build ./data/index.json + ./data/cache
#   3. docker compose up -d web           # http://127.0.0.1:7860
#   MCP: docker compose run --rm -T mcp   (see README for the client config)

x-base: &base
  image: python:3.12-slim
  working_dir: /app
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./:/app:ro                 # the code
    - ./packages:/packages:ro    # your Synty content, read-only
    - ./data:/data               # index.json + extracted thumbnails/models/textures

services:
  index:
    <<: *base
    profiles: ["tools"]
    command: ["python", "-m", "synty_explorer", "index", "/packages", "-o", "/data/index.json", "--cache", "/data/cache"]

  web:
    <<: *base
    command: ["python", "-m", "synty_explorer", "serve", "-i", "/data/index.json", "--host", "0.0.0.0", "--port", "7860"]
    ports:
      - "127.0.0.1:7860:7860"    # localhost only: licensed content stays on your machine
    restart: unless-stopped

  mcp:
    <<: *base
    profiles: ["tools"]
    stdin_open: true
    command: ["python", "-m", "synty_explorer", "mcp", "-i", "/data/index.json"]
