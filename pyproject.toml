[project]
name = "synty-explorer"
version = "0.1.0"
description = "Search, preview and compare Synty assets outside Unity (web UI + MCP)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
synty-explorer = "synty_explorer.cli:main"

[tool.setuptools.package-data]
synty_explorer = ["web/*.html"]
